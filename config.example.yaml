paths:
  project_root: "<PROJECT_ROOT>"

  raw_dir: "data/raw"
  processed_dir: "data/processed"
  merged_output_dir: "data/processed/versions"

  model_dir: "models"
  evaluation_dir: "evaluation"

data_sources:
  weather:
    start_date: "YYYYMMDD"
    end_date: "YYYYMMDD"
    states:
      <STATE_NAME>: [<LAT>, <LON>]

  ndvi:
    path: "data/raw/ndvi_data.csv"
    start_year: 2011
    end_year: 2022

  soc:
    local_file: "data/raw/soc_stats.csv"

  yield:
    path: "data/raw/yield_data.csv"

merge:
  required_keys:
    - "State"
    - "Year"
    - "Season"

settings:
  drop_rows_with_missing_yield: true

preprocessing:
  outliers:
    method: "iqr_groupwise"
    iqr_multiplier: 1.5

feature_engineering:
  climate:
    temp_stress_threshold: 35.0

data_split:
  train_size: 0.7
  val_size: 0.15
  test_size: 0.15

model:
  teacher:
    type: "stacking_regressor"

  student:
    type: "lightgbm"

evaluation:
  metrics:
    - "rmse"
    - "mae"

explain:
  enabled: true
  method: shap
